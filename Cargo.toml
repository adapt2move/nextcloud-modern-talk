[workspace]
members = ["crates/talk-core", "crates/talk-adapters", "apps/bootstrap"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "EUPL-1.2"
publish = false

[workspace.dependencies]
talk-core = { path = "crates/talk-core" }
talk-adapters = { path = "crates/talk-adapters" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
