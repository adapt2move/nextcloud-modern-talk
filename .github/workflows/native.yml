name: Native release checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  windows:
    name: Compile only (Windows x86_64 MSVC)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python tools/ci/build_env.py --target x86_64-pc-windows-msvc
      - run: python tools/ci/prepare_gstreamer.py --target x86_64-pc-windows-msvc
      - run: python tools/release/toolchain.py --target x86_64-pc-windows-msvc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-windows-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: python tools/cargo.py build --locked --workspace --all-targets --target x86_64-pc-windows-msvc

  macos:
    name: Compile and package only (macOS Apple Silicon)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/ci/build_env.py --target aarch64-apple-darwin --install-metal-toolchain
      - name: Compile native PDF and notification helper
        run: python3 tools/native/build-macos-helper.py --output "$RUNNER_TEMP/talk-native-helper"
      - name: Verify identity continuity with a disposable signer
        run: python3 tools/native/check-macos-signing.py
      - run: python3 tools/ci/prepare_gstreamer.py --target aarch64-apple-darwin
      - run: python3 tools/release/toolchain.py --target aarch64-apple-darwin
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-macos-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: python3 tools/cargo.py build --locked --workspace --all-targets --target aarch64-apple-darwin
      - name: Assemble and verify the self-contained app and DMG
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          env -u RUSTFLAGS python3 tools/release/build.py --target aarch64-apple-darwin --version "$version" --output "$RUNNER_TEMP/macos-package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-package-${{ github.sha }}
          path: ${{ runner.temp }}/macos-package/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
