name: macOS installer layout validation
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  macos:
    name: Build and inspect macOS installer
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 tools/ci/build_env.py --target aarch64-apple-darwin --install-metal-toolchain
      - run: python3 tools/ci/prepare_gstreamer.py --target aarch64-apple-darwin
      - run: python3 tools/release/toolchain.py --target aarch64-apple-darwin
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/registry
          key: cargo-macos-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: python3 tools/release/build.py --target aarch64-apple-darwin --version 0.0.4 --output "$RUNNER_TEMP/macos-package"
      - name: Capture the actual read-only Finder layout
        run: python3 tools/release/mac-preview.py "$RUNNER_TEMP/macos-package" "$RUNNER_TEMP/dmg-preview"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: macos-package
          path: ${{ runner.temp }}/macos-package/*
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: dmg-preview
          path: ${{ runner.temp }}/dmg-preview/*
          if-no-files-found: warn
          retention-days: 7
