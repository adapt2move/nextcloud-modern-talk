function general(){const d=isDirect(),off=!canManage()||d;return title('Allgemein','Alles Wichtige zu dieser Unterhaltung.')+(!d?managerNote():note('Name und Bild stammen aus dem Profil der anderen Person.'))+`<div class="avatar-edit"><div class="large-avatar">${icon(room().icon)}</div><div>${secondary('Bild ändern','avatar',off)}<p>Ein eindeutiges Bild hilft beim Wiederfinden.</p></div></div><label class="field">Name<input data-field="name" maxlength="100" value="${esc(state.fields.name||room().name)}"${disabled(off)}></label><label class="field">Beschreibung<textarea data-field="description" maxlength="500"${disabled(off)}>${esc(state.fields.description??'Ideen, Entscheidungen und alles rund um unser Produkt.')}</textarea></label><div class="form-actions" id="metadata-actions"${state.dirty?'':' hidden'}><button class="secondary" data-action="discard">Verwerfen</button><button class="primary" data-action="save">Änderungen speichern</button></div>`+(!d?row('Unterhaltung sperren','Nachrichten bleiben lesbar. Neue Beiträge sind gesperrt.',toggle('readonly','Unterhaltung sperren',!canManage())):'')+`<div class="lifecycle">${row('Archivieren','Nur aus deiner aktiven Liste entfernen.',secondary('Archivieren','archive'))}${!d?row('Unterhaltung verlassen','Du verlierst den Zugriff auf dieses Gespräch.',secondary('Verlassen','leave')):''}${!d?row('Unterhaltung löschen','Für alle Mitglieder endgültig entfernen.',secondary('Löschen','delete',!canManage(),'danger')):''}</div>`}
function notifications(){return title('Benachrichtigungen','Deine Regeln für diese Unterhaltung.')+row('Wichtige Unterhaltung','NextCloud meldet diese Unterhaltung auch bei seinem Nichtstören-Status.',toggle('important','Wichtige Unterhaltung'))+note('Der Fokusmodus deines Betriebssystems bleibt wirksam. Vorschauen folgen deinen Datenschutzeinstellungen.')+`<h3 class="small-title">Nachrichten</h3><div class="choice">${[['all','Alle Nachrichten'],['mentions','Nur Erwähnungen'],['none','Keine Nachrichten']].map(([value,label])=>`<label><input type="radio" name="notify" value="${value}"${state.notifications===value?' checked':''}>${label}</label>`).join('')}</div>`+row('Anrufe melden','Eingehende Anrufe in dieser Unterhaltung anzeigen.',toggle('calls','Anrufe melden',state.room==='channel'))+note(state.room==='channel'?'Der Server erlaubt in diesem Talk-Kanal keine Anrufe.':'Banner und Töne legst du zentral in den App-Einstellungen fest. Hier entscheidest du, welche Ereignisse dieses Gesprächs dich erreichen.')}
function privacy(){return title('Datenschutz','Bestimme, welche Inhalte sichtbar bleiben.')+row('Als sensibel markieren',isClassified()?'Bei geheimen Unterhaltungen immer aktiv.':'Keine Nachrichtenvorschau in der Liste, Suche oder in Benachrichtigungen.',`<button class="switch" role="switch" aria-label="Als sensibel markieren" aria-checked="${isClassified()||state.sensitive}" data-toggle="sensitive"${disabled(isClassified())}></button>`)+(isClassified()?note('Diese Schutzvorgabe kann nicht ausgeschaltet werden.'):note('Die Nachricht selbst bleibt in der geöffneten Unterhaltung lesbar.'))+`<h3 class="section-title">Aufbewahrung</h3>`+row('Nachrichten automatisch löschen','Gilt für alle. Der Server bestimmt den tatsächlichen Löschzeitpunkt.',`<select id="expiration" aria-label="Nachrichten automatisch löschen"${disabled(!canManage())}>${[['off','Aus'],['hour','Nach 1 Stunde'],['day','Nach 1 Tag'],['week','Nach 1 Woche']].map(([v,t])=>`<option value="${v}"${state.expiration===v?' selected':''}>${t}</option>`).join('')}</select>`)+(!canManage()?note('Die Aufbewahrung wird von Moderatoren verwaltet.'):'')+`<div class="lifecycle">${row('Chatverlauf löschen','Den bisherigen Verlauf für alle entfernen.',secondary('Verlauf löschen','history',!canManage(),'danger'))}</div>`+note('Heruntergeladene Dateien und Kopien anderer Personen werden dadurch nicht entfernt.')}
function permissions(){return title('Berechtigungen','Wer darf im Gespräch was tun?')+managerNote()+`<h3 class="section-title">Mitglieder im Meeting</h3>`+[['permissionJoin','Am Meeting teilnehmen','Einem laufenden Meeting beitreten.'],['permissionStart','Meeting starten','Ein neues Gespräch beginnen.'],['permissionMic','Mikrofon verwenden','Im Meeting sprechen.'],['permissionCamera','Kamera verwenden','Das eigene Kamerabild übertragen.'],['permissionShare','Bildschirm teilen','Ein Fenster oder den Bildschirm präsentieren.']].map(([k,t,s])=>row(t,s,toggle(k,t,!canManage()||state.room==='channel'))).join('')+note(state.room==='channel'?'Dieser Talk-Kanal verbietet Anrufe für alle Rollen.':'Dies sind Standardrechte. Persönliche Ausnahmen müssen beim Ändern ausdrücklich berücksichtigt werden.')+`<h3 class="section-title">Gesperrte Personen</h3><div class="empty">Keine Personen gesperrt.</div>${secondary('Person sperren','ban',!canManage())}`}
function meeting(){if(isDirect())return title('Meeting','Ein Gespräch zu zweit.')+note('Lobby, Gast-Link und Gruppenräume stehen in privaten Gesprächen nicht zur Verfügung. Du startest den Anruf direkt über das Kopfhörer-Symbol.');if(state.room==='channel')return title('Meeting','In diesem Talk-Kanal nicht verfügbar.')+note('Der Server untersagt Anrufe in diesem Gespräch – auch für Moderatoren. Ein normaler Gruppenchat in deiner Rubrik „Kanäle“ kann dagegen Anrufe unterstützen.');return title('Meeting','Ein ruhiger Einstieg. Klare Rollen im Gespräch.')+managerNote()+row('Lobby aktivieren','Gäste und Mitglieder warten, bis ein Moderator sie einlässt.',toggle('lobby','Lobby aktivieren',!canManage()))+row('Moderation','Rollen verwaltest du direkt bei den Mitgliedern.',secondary('Mitglieder','members'))+`<h3 class="section-title">Gäste</h3>`+row('Gäste über Link zulassen',isClassified()?'In geheimen Unterhaltungen nicht erlaubt.':'Ermöglicht auch Personen außerhalb deiner Organisation den Beitritt.',toggle('guests','Gäste über Link zulassen',!canManage()||isClassified()))+(state.guests&&!isClassified()?`<label class="field" style="margin-top:15px">Link-Passwort<input type="password" placeholder="Nach Servervorgabe" aria-label="Link-Passwort im Entwurf"${disabled(!canManage())}></label>${secondary('Gast-Link vorbereiten','guest',!canManage())}`:'')+`<h3 class="section-title">Gruppenräume</h3><p class="mini-help">Teile das Meeting in kleinere Gesprächsrunden auf.</p><div class="room-grid">${Array.from({length:state.breakouts},(_,i)=>`<div class="mini-room">Gruppe ${i+1}<small>Noch nicht zugewiesen</small></div>`).join('')}</div><div style="margin-top:12px">${secondary('Gruppenräume einrichten','breakouts',!canManage())}</div>`}
function content(){return({general,notifications,privacy,permissions,meeting})[state.tab]()}
function people(){
 if(state.room==='channel'&&!canManage())return `<div class="empty">Die Mitgliederliste dieses Talk-Kanals ist nur für Moderatoren sichtbar.</div>`;
 if(state.csv)return `<button class="text-button" data-action="csv-back">← Zurück zur Mitgliederliste</button><h2 style="font-size:20px;margin:10px 0 5px">Personen aus CSV einladen</h2><p class="mini-help">Erst prüfen, dann einladen. Es wird nichts automatisch versendet.</p><div class="notice">${icon('info')}<span>Beispielvorschau für eine lokale CSV-Auswahl. Im Entwurf wird keine Datei hochgeladen.</span></div><div class="draft-list">nora.brandt · Person gefunden<br>sam.weber · Person gefunden<br><span class="danger">alex@extern.example · Gäste hier nicht zulässig</span></div><div class="form-actions"><button class="secondary" data-action="csv-back">Abbrechen</button><button class="primary" data-action="invite-csv">2 Einladungen prüfen</button></div>`;
 const members=[['AS','Alex Sommer','Du · Organisation','Moderator','blue'],['MF','Mara Fischer','mara.fischer','Moderator',''],['JW','Jonas Weber','jonas.weber','Mitglied','green'],['LH','Lena Hoffmann','lena.hoffmann','Mitglied','blue'],['PT','Paul Timm','paul.timm','Mitglied','green'],['JK','Jana König','jana.koenig','Mitglied',''],['FN','Finn Neumann','finn.neumann','Mitglied','blue']];
 const q=state.query.toLocaleLowerCase('de'),visibleMembers=members.slice(0,Math.min(room().count,7)),matching=visibleMembers.filter(m=>(m[1]+' '+m[2]).toLocaleLowerCase('de').includes(q));
 let html=`<label class="search-field">${icon('search')}<input id="member-search" aria-label="Mitglieder und Personen in NextCloud suchen" placeholder="Mitglieder und Personen in NextCloud suchen …" value="${esc(state.query)}" maxlength="100"></label><p class="mini-help">Rollen, Einladungen und Bots gehören zu dieser Unterhaltung.</p><div id="member-results">`+matching.map(([initials,name,sub,role,color],i)=>`<div class="member-row"><div class="avatar ${color}">${initials}</div><div class="member-name"><strong>${name}</strong><small>${sub}</small></div>${canManage()&&!sub.startsWith('Du')?`<select aria-label="Rolle für ${name}" data-role-person="${name}"><option${role==='Mitglied'?' selected':''}>Mitglied</option><option${role==='Moderator'?' selected':''}>Moderator</option></select>`:`<span class="pill">${role}</span>`}${canManage()&&!sub.startsWith('Du')?`<button class="icon-button" data-remove="${name}" aria-label="${name} entfernen" title="Aus Unterhaltung entfernen">${icon('x')}</button>`:''}</div>`).join('')+'</div>';
 if(room().count>7&&!q)html+=`<p class="mini-help">7 von ${room().count} Mitgliedern in dieser Beispielseite.</p>`;
 if(q&&'sam weber sam.weber'.includes(q)){html+=`<div class="directory-label">Verzeichnis · NextCloud</div><div class="member-row"><div class="avatar green">SW</div><div class="member-name"><strong>Sam Weber</strong><small>sam.weber · noch nicht eingeladen</small></div>${secondary('Einladen','invite',!canManage())}</div><p class="mini-help">Fiktiver Verzeichnistreffer im Entwurf; kein echter Suchaufruf.</p>`;}
 return html;
}
function bots(){return title('Bots','Automatisierungen für diese Unterhaltung.')+note('Hier aktivierst du Bots, die deine Organisation bereitstellt.')+(isClassified()?`<div class="notice">${icon('lock')}Bots sind in geheimen Unterhaltungen nicht erlaubt.</div>`:row('Projekt-Bot','Sendet Updates zu Aufgaben und Meilensteinen.',toggle('bot','Projekt-Bot aktivieren',!canManage())))+`<div class="row"><div><h3>Weitere Bots</h3><p>Neue Bots werden von deiner NextCloud-Administration bereitgestellt.</p></div><span class="pill">Organisation</span></div>`}
function renderDialog(){const el=document.querySelector('#dialog-root');document.querySelector('#demo-view').value=state.view;if(state.view==='chat'){el.innerHTML='';document.querySelector('.workspace').inert=false;return}document.querySelector('.workspace').inert=true;const members=state.view==='members';el.innerHTML=`<div class="shade" data-action="close"></div><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="dialog-head"><div class="room-emblem">${icon(members?'users':room().icon)}</div><div><h1 id="dialog-title">${members?'Mitglieder':'Unterhaltungseinstellungen'}</h1><p>${esc(state.fields.name||room().name)}${members?' · '+room().count+' Mitglieder':''}</p></div><button class="close icon-button" data-action="close" aria-label="Dialog schließen">${icon('x')}</button></header>${members?`<div class="members-content"><div class="member-top"><div class="segmented" role="tablist" aria-label="Mitgliederverwaltung"><button class="${state.memberTab==='people'?'active':''}" role="tab" aria-selected="${state.memberTab==='people'}" data-member-tab="people">Personen</button><button class="${state.memberTab==='bots'?'active':''}" role="tab" aria-selected="${state.memberTab==='bots'}" data-member-tab="bots">Bots</button></div>${state.memberTab==='people'?`<button class="text-button" data-action="csv"${disabled(!canManage())}>${icon('download')}CSV importieren</button>`:''}</div>${state.memberTab==='people'?people():bots()}</div>`:`<div class="dialog-body"><nav class="settings-nav" role="tablist" aria-label="Einstellungskategorien">${tabs.map(([key,label,ico])=>`<button role="tab" id="tab-${key}" aria-selected="${state.tab===key}" aria-controls="settings-panel" tabindex="${state.tab===key?'0':'-1'}" data-tab="${key}">${icon(ico)}${label}</button>`).join('')}</nav><div class="content" id="settings-panel" role="tabpanel" tabindex="0" aria-labelledby="tab-${state.tab}">${content()}</div></div>`}</section>`;}
function render(){renderHeader();renderDialog();}
function feedback(text){clearTimeout(toastTimer);document.querySelector('#toast-root').innerHTML=`<div class="toast">${icon('info')}<span>${esc(text)}</span></div>`;toastTimer=setTimeout(()=>document.querySelector('#toast-root').innerHTML='',4200)}
const confirms={archive:['Unterhaltung archivieren?','Sie verschwindet nur aus deiner aktiven Liste. Unter „Archiv“ findest du sie wieder.','Archivieren'],leave:['Unterhaltung verlassen?','Du verlierst den Zugriff. Ein laufender Anruf zu verlassen ist eine andere Aktion.','Verlassen'],delete:['Unterhaltung für alle löschen?','„'+room().name+'“ und sein Verlauf werden für alle entfernt. Diese Aktion ist nicht rückgängig zu machen.','Endgültig löschen'],history:['Chatverlauf für alle löschen?','Alle bisherigen Nachrichten dieser Unterhaltung werden entfernt. Die Unterhaltung selbst bleibt bestehen.','Verlauf löschen'],invite:['Sam Weber einladen?','Die Person erhält Zugriff auf diese Unterhaltung. Erst die bestätigte Einladung ändert die Mitgliedschaft.','Einladung senden'],'invite-csv':['2 Personen einladen?','Nora Brandt und Sam Weber erhalten eine Einladung. Der ungültige externe Eintrag wird ausgelassen.','Einladungen senden'],ban:['Person für diese Unterhaltung sperren?','Die Person kann der Unterhaltung nicht erneut beitreten. Entfernen ohne Sperre erfolgt in der Mitgliederliste.','Person auswählen'],guest:['Gast-Link vorbereiten?','Die Servervorgaben müssen vor dem Freigeben eines Links bestätigt sein. In diesem Entwurf wird kein Link erzeugt.','Vorschau schließen'],breakouts:['Gruppenräume einrichten','Wähle die Anzahl der Räume. Personen werden danach ausdrücklich zugewiesen.','Konfiguration übernehmen']};
function confirmAction(key,custom){const data=custom||confirms[key];state.confirmation=key;document.querySelector('#confirmation-root').innerHTML=`<div class="confirmation"><section class="confirmation-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-description"><h2 id="confirm-title">${esc(data[0])}</h2><p id="confirm-description">${esc(key==='delete'?'„'+room().name+'“ und sein Verlauf werden für alle entfernt. Diese Aktion ist nicht rückgängig zu machen.':data[1])}</p>${key==='breakouts'?'<label class="field">Anzahl der Räume<select id="room-count"><option>2</option><option>3</option><option>4</option></select></label>':''}<div class="form-actions"><button class="secondary" data-action="cancel-confirm">Abbrechen</button><button class="${['delete','history','leave','ban','remove'].includes(key)?'danger-fill':'primary'}" data-action="confirm">${esc(data[2])}</button></div></section></div>`;document.querySelector('#dialog-root').inert=true;document.querySelector('[data-action="cancel-confirm"]').focus()}
function dismissConfirmation(){state.confirmation=null;document.querySelector('#confirmation-root').innerHTML='';document.querySelector('#dialog-root').inert=false;document.querySelector('.close')?.focus()}
function closeDialog(){if(state.confirmation){dismissConfirmation();return}state.view='chat';renderDialog();if(lastInvoker?.id)document.getElementById(lastInvoker.id)?.focus()}
function openDialog(view){lastInvoker=document.activeElement;state.view=view;if(view==='members'&&isDirect()){state.view='settings';state.tab='general'}renderDialog();document.querySelector('.close')?.focus()}
document.addEventListener('click',event=>{
 const target=event.target.closest('button,[data-action]');if(!target||target.disabled)return;
 if(target.dataset.tab){state.tab=target.dataset.tab;renderDialog();document.querySelector('#tab-'+state.tab).focus();return}
 if(target.dataset.memberTab){state.memberTab=target.dataset.memberTab;state.csv=false;renderDialog();document.querySelector('[data-member-tab="'+state.memberTab+'"]').focus();return}
 if(target.dataset.toggle){const key=target.dataset.toggle;state[key]=!state[key];target.setAttribute('aria-checked',String(state[key]));if(key==='guests'){renderDialog();document.querySelector('[data-toggle="guests"]').focus()}return}
 if(target.dataset.remove){confirmAction('remove',[target.dataset.remove+' entfernen?','Die Person verliert ihre Mitgliedschaft. Eine Sperre für zukünftige Beitritte ist eine separate Aktion.','Entfernen']);return}
 const action=target.dataset.action;
 if(action==='members'||action==='settings'){openDialog(action);return}
 if(action==='close'){closeDialog();return}
 if(action==='pin'){state.pinned=!state.pinned;renderHeader();document.querySelector('#pin-button').focus();return}
 if(action==='call'){feedback(['conference','webinar','presentation'].includes(state.room)?'Entwurf: Meeting-Vorbereitung mit Geräteauswahl.':'Entwurf: direkter Audio-Einstieg; erforderliche Freigaben bleiben erhalten.');return}
 if(action==='csv'){state.csv=true;renderDialog();return}
 if(action==='csv-back'){state.csv=false;renderDialog();return}
 if(action==='avatar'){feedback('Entwurf: Bild auswählen oder entfernen.');return}
 if(action==='save'){state.dirty=false;render();feedback('Metadaten im Entwurf geändert.');return}
 if(action==='discard'){state.fields={};state.dirty=false;render();return}
 if(action==='cancel-confirm'){dismissConfirmation();return}
 if(action==='confirm'){if(state.confirmation==='breakouts')state.breakouts=Number(document.querySelector('#room-count').value);dismissConfirmation();renderDialog();feedback('Nur im Entwurf bestätigt – keine Serveränderung.');return}
 if(confirms[action])confirmAction(action);
});
document.addEventListener('input',event=>{const target=event.target;if(target.dataset.field){state.fields[target.dataset.field]=target.value;state.dirty=true;document.querySelector('#metadata-actions').hidden=false}if(target.id==='member-search'){const pos=target.selectionStart;state.query=target.value;renderDialog();const input=document.querySelector('#member-search');input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener('change',event=>{const t=event.target;if(t.id==='demo-view'){openDialog(t.value);return}if(t.id==='demo-room'){state.room=t.value;state.fields={};state.dirty=false;state.guests=false;state.sensitive=false;state.csv=false;state.query='';state.confirmation=null;document.querySelector('#confirmation-root').innerHTML='';document.querySelector('#dialog-root').inert=false;if(isDirect()&&state.view==='members')state.view='settings';render();return}if(t.id==='demo-role'){state.role=t.value;renderDialog();return}if(t.name==='notify')state.notifications=t.value;if(t.id==='expiration')state.expiration=t.value;if(t.dataset.rolePerson){feedback('Rollenänderung im Entwurf; in der App erst nach bestätigter Serverantwort.')}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();closeDialog();return}if(event.target.dataset.tab&&['ArrowDown','ArrowUp','ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();let i=tabs.findIndex(t=>t[0]===state.tab);i=event.key==='Home'?0:event.key==='End'?tabs.length-1:(i+(['ArrowDown','ArrowRight'].includes(event.key)?1:-1)+tabs.length)%tabs.length;state.tab=tabs[i][0];renderDialog();document.querySelector('#tab-'+state.tab).focus();return}if(event.key==='Tab'&&state.view!=='chat'){const owner=document.querySelector(state.confirmation?'.confirmation-card':'.dialog');const focusable=Array.from(owner.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]')).filter(e=>e.getClientRects().length&&e.tabIndex>=0);const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
render();

window.checkConversationDesign=()=>{const original=JSON.stringify(state);const results=[];const expect=(name,value)=>{results.push({name,pass:!!value});if(!value)throw new Error(name)};try{state.view='settings';state.room='group';state.role='moderator';for(const [tab]of tabs){state.tab=tab;render();expect('tab '+tab,!!document.querySelector('#settings-panel h2'))}state.room='direct';render();expect('private chat hides members',!document.querySelector('#members-button'));state.room='channel';render();expect('server channel blocks calls',document.querySelector('#call-button').disabled);state.role='member';state.view='members';render();expect('restricted member list',document.querySelector('.members-content').textContent.includes('nur für Moderatoren'));state.room='classified';state.view='settings';state.tab='privacy';render();expect('classified forced sensitive',document.querySelector('[data-toggle="sensitive"]').disabled&&document.querySelector('[data-toggle="sensitive"]').getAttribute('aria-checked')==='true');state.room='group';state.role='member';state.tab='general';render();expect('member cannot edit metadata',document.querySelector('[data-field="name"]').disabled);state.role='moderator';state.view='members';state.query='sam';state.memberTab='people';render();expect('directory invite separate',!!document.querySelector('[data-action="invite"]'));confirmAction('history');expect('destructive confirmation names all',document.querySelector('#confirm-title').textContent.includes('für alle'));dismissConfirmation();expect('no network capable form',document.forms.length===0);return results}finally{Object.assign(state,JSON.parse(original));document.querySelector('#confirmation-root').innerHTML='';document.querySelector('#dialog-root').inert=false;render()}};
