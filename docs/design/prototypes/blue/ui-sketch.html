window.screenDefinitions=[
{id:"server",title:"01 · Cloud verbinden",description:"Serveradresse eingeben. Ein klarer Einstieg mit nur einer Entscheidung."},
{id:"browser",title:"02 · Im Browser anmelden",description:"Der Client wartet auf die Freigabe. Passwort und Zwei-Faktor-Anmeldung bleiben in eurer Nextcloud."},
{id:"ready",title:"03 · Ankommen",description:"Das verbundene Konto bestätigen. Mitteilungen lassen sich jetzt oder später erlauben."},
{id:"expired",title:"04 · Abgelaufener Anmeldelink",description:"Ein verständlicher Fehler mit direktem Weg zu einem neuen Anmeldelink."},
{id:"chat",title:"05 · Gespräche",description:"Eine gemeinsame Gesprächsliste mit Personen, Gruppen und Räumen. Avatare, Vorschau und Anrufstatus ersetzen die bisherige Channel-Navigation."},
{id:"thread",title:"06 · Antworten",description:"Ein Gespräch im Kontext weiterführen, ohne den Hauptverlauf zu verlassen."},
{id:"search",title:"07 · Suche",description:"Mit ⌘K schnell Nachrichten, Dateien und Gespräche finden."},
{id:"settings",title:"08 · Einstellungen",description:"Darstellung und Lesbarkeit anpassen. Konten und Mitteilungen bleiben leicht erreichbar."},
{"id": "prejoin", "title": "09 · Gerätecheck", "description": "Freiwilliger Konferenzbeitritt: Kamera-Vorschau, Mikrofonpegel und Geräteauswahl. Videobild schematisch dargestellt."},
{"id": "call", "title": "10 · Videokonferenz", "description": "Vier Personen, aktive Sprecherin, Kamera aus und dauerhafter Gesprächs-Chat. Videobilder sind Platzhalter."},
{"id": "sharepicker", "title": "11 · Freigabe auswählen", "description": "Schematische Freigabeauswahl. Im nativen Client soll hier die macOS-Systemauswahl über ScreenCaptureKit erscheinen."},
{"id": "sharing", "title": "12 · Bildschirm teilen", "description": "Das geteilte Fenster im Fokus, Personen daneben und ein jederzeit erreichbarer Stopp für die Freigabe."},
{"id": "incoming", "title": "13 · Eingehender Direktanruf", "description": "Mara ruft dich persönlich an. Annehmen führt ohne Gerätecheck direkt in den Anruf mit zwei Personen."},
{"id": "create34", "title": "14 · Gespräch erstellen · NC 34", "description": "Gemeinsame Basis von Talk 24: Gruppengespräch, Gesprächsraum, Webinar und Präsentation. Beispiel eines Servers mit aktivierten Anrufen."},
{"id": "create35", "title": "15 · Gespräch erstellen · NC 35", "description": "Talk 25 ergänzt verfügbare Vorlagen, hier Vertraulich und Kanal. Ankündigungen bleiben Admins vorbehalten und erscheinen in diesem Beispiel nicht."},
{"id": "room", "title": "16 · Besprechungsraum", "description": "Ein Gruppengespräch mit Gastzugang: Chat, Unterlagen, laufender Anruf und Teilnehmende gehören zum selben Gespräch. Gastlink und Auffindbarkeit sind getrennte Einstellungen."},
{"id": "discover", "title": "17 · Offene Gespräche", "description": "Vom Server auffindbar gemachte Gespräche. Der Teamküche-Kurzweg öffnet ihren Gerätecheck. Erst „Jetzt teilnehmen“ führt in den Anruf."},
{"id": "voice", "title": "18 · Gesprächsraum", "description": "Teamküche nach bewusstem Beitritt über den Gerätecheck. Zwei Personen, Mikrofon an, Kamera aus. Teilen bleibt eine gekennzeichnete Illustration."},
{"id":"direct-call","title":"19 · Direktanruf angenommen","description":"Mara und Alex im persönlichen Anruf. Direkt nach Annehmen, ohne Konferenz-Vorschau; Kamera aus. Schematisches Zielbild."},
{"id": "voice-room", "title": "20 · Teamküche · Gespräch", "description": "Teamküche als Gespräch öffnen: Chat und Anrufstatus, noch kein Beitritt und keine Medienaktivierung. „Anruf beitreten“ öffnet den Gerätecheck."}
];
function template(id){return document.getElementById(id).content.cloneNode(true)}
function paintIcons(root){root.querySelectorAll("[data-icon]").forEach(function(el){el.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+(icons[el.dataset.icon]||icons.plus)+'</svg>'})}
window.designProfiles={"nc34": {"server": "Nextcloud 34", "talk": "Talk 24.x", "capabilities": ["conversation-presets"], "presets": ["default", "voiceroom", "webinar", "presentation"], "callsEnabled": true, "admin": false}, "nc35": {"server": "Nextcloud 35", "talk": "Talk 25.x", "capabilities": ["conversation-presets", "classified-conversations", "announcement-preset"], "presets": ["default", "voiceroom", "webinar", "presentation", "classified", "channel"], "callsEnabled": true, "admin": false}};
// Synthetic design profiles only. Real values must come from the server.
const presetLabels={default:['Gruppengespräch','Chat, Dateien und Anrufe für euer Team.','users'],voiceroom:['Gesprächsraum','Für spontane Gespräche. Beitritt mit Gerätecheck.','headphones'],webinar:['Webinar','Mit Lobby und gesteuerten Sprechrechten.','video'],presentation:['Präsentation','Für Vorträge mit vielen Zuhörenden.','monitor-up'],classified:['Vertraulich','Geschütztes Gespräch mit eingeschränkten Funktionen.','shield'],channel:['Kanal','Moderierte Nachrichten. Ohne Anrufe.','megaphone'],announcement:['Ankündigung','Mitteilungen an alle. Nur für Administratoren.','megaphone']};
window.availableDesignPresets=function(profile){if(!profile.capabilities.includes('conversation-presets'))return [];return profile.presets.filter(id=>presetLabels[id]&&(id!=='voiceroom'||profile.callsEnabled)&&(!['channel','announcement'].includes(id)||profile.capabilities.includes('announcement-preset'))&&(id!=='classified'||profile.capabilities.includes('classified-conversations'))&&(id!=='announcement'||profile.admin))};
function fillPresets(root,profile){const grid=root.querySelector('.preset-grid');availableDesignPresets(profile).forEach(id=>{const [title,detail,ic]=presetLabels[id];const b=document.createElement('button');b.className='preset-card'+(id==='default'?' selected':'');b.dataset.preset=id;b.innerHTML='<span class="room-avatar"><span data-icon="'+ic+'"></span></span><span><strong>'+title+'</strong><small>'+detail+'</small></span><span class="radio"></span>';b.onclick=()=>{grid.querySelectorAll('.preset-card').forEach(x=>x.classList.toggle('selected',x===b))};grid.append(b)})}
const meetingContexts={
 product:{name:'Produktteam',conversation:'chat',call:'call'},
 design:{name:'Designbesprechung',conversation:'room',call:'call'},
 voice:{name:'Teamküche',conversation:'voice-room',call:'voice'}
};
window.meetingContext='product';
function configureVoicePrejoin(root){
 root.querySelector('.meeting-kind').innerHTML='<span data-icon="headphones"></span>Sprachgespräch';
 root.querySelector('.prejoin-copy>p').textContent='Wähle deine Geräte. Erst „Jetzt teilnehmen“ bestätigt deinen Beitritt.';
 root.querySelector('.preview-video').classList.add('preview-idle');
 root.querySelector('.preview-video').innerHTML='<div class="avatar alex">AS</div><strong>Du bist noch nicht im Anruf</strong><p>Mikrofon und Kamera sind noch aus.</p>';
 root.querySelector('.prejoin-presence').innerHTML='<div class="mini-avatars"><span class="avatar tiny mara">MF</span></div>Mara ist schon da.';
 root.querySelector('.device-field .device-select').innerHTML='<span data-icon="video-off"></span>Kamera aus<span data-icon="chevron-down"></span>';
 root.querySelector('.input-meter').innerHTML='<span>Kein Mikrofontest gestartet</span>';
 root.querySelector('.device-foot .primary').innerHTML='<span data-icon="phone"></span>Jetzt teilnehmen';
 root.querySelector('.device-foot p').innerHTML='Beim Beitritt: Mikrofon an, Kamera aus.<br>Berechtigungen und Richtlinien gelten.';
 root.querySelector('.prejoin-footer').innerHTML='<span data-icon="lock"></span>Kein Beitritt und keine Aufnahme vor deiner Bestätigung.';
}


window.renderScreen=function(id){
const root=document.getElementById("app");
if(id==='chat')window.meetingContext='product';
if(id==='room')window.meetingContext='design';
if(id==='voice-room'||id==='voice')window.meetingContext='voice';
// Voice sharing is intentionally not illustrated: never substitute another call.
if(window.meetingContext==='voice'&&['call','sharepicker','sharing'].includes(id))id='voice';
root.replaceChildren();
if(["server","browser","ready","expired"].includes(id)){
 root.append(template("window-auth"));
 root.querySelector(".auth-sheet").append(template("auth-"+id));
 const current={server:1,browser:2,ready:3,expired:2}[id];
 root.querySelectorAll(".step").forEach(function(step){const n=Number(step.dataset.step);step.classList.toggle("current",n===current);step.classList.toggle("done",n<current);if(n<current)step.querySelector("b").innerHTML='<span data-icon="check"></span>'});
}else if(["prejoin","call","sharing","sharepicker","voice","direct-call"].includes(id)){
 root.append(template("meeting-"+(id==="sharepicker"?"call":id)));
 if(id==="sharepicker")root.querySelector(".window").append(template("sharepicker"));
}else{
 root.append(template("window-workspace"));
 if(['room','voice-room','discover'].includes(id)){root.querySelector('.content').replaceChildren(template(id));root.querySelectorAll('.conversation-row.active').forEach(e=>e.classList.remove('active'));const selected=root.querySelector('.conversation-row[data-screen="'+id+'"]');if(selected)selected.classList.add('selected-room')}
 if(id==='create34'||id==='create35'){root.querySelector('.window').append(template('create'));fillPresets(root,designProfiles[id==='create34'?'nc34':'nc35'])}
 if(id==="thread"){root.querySelector(".content").append(template("thread"));root.querySelector(".content").classList.add("has-thread")}
 if(id==="search"||id==="settings"||id==="incoming")root.querySelector(".window").append(template(id));
}
if(['prejoin','call','sharing','sharepicker'].includes(id)){
 const context=meetingContexts[window.meetingContext];
 root.querySelectorAll('.meeting-heading h1,.call-top h1,.call-chat .chat-note strong').forEach(e=>e.textContent=context.name);
 root.querySelectorAll('.meeting-heading p').forEach(e=>e.textContent='Ein Anruf in '+context.name);
 root.querySelectorAll('.placeholder').forEach(e=>e.textContent='Nachricht an '+context.name);
 root.querySelectorAll('button[data-screen="chat"]').forEach(e=>e.dataset.screen=context.conversation);
 if(id==='prejoin'){
  root.querySelector('.device-foot button[data-screen]').dataset.screen=context.call;
  if(window.meetingContext==='voice')configureVoicePrejoin(root);
 }
}
document.querySelector('.footnote').textContent='TALK · UI-SKIZZE · KEIN NATIVER CLIENT · '+(id==='create34'?'NEXTCLOUD 34 / TALK 24':id==='create35'?'NEXTCLOUD 35 / TALK 25':'GEMEINSAME BASIS FÜR NEXTCLOUD 34 + 35')+' · BEISPIELDATEN';
paintIcons(root);
if(id==="incoming"){root.querySelector(".workspace-layout").inert=true;root.querySelector(".incoming-card").focus({preventScroll:true})}
document.body.dataset.screen=id;
if(id==="thread")root.querySelector(".timeline").scrollTop=root.querySelector(".timeline").scrollHeight;
document.title="Talk — "+(screenDefinitions.find(function(s){return s.id===id})||screenDefinitions[0]).title;
document.querySelectorAll("#review-controls button").forEach(function(b){b.classList.toggle("selected",b.dataset.screen===id)});
return {screen:id,width:root.querySelector(".window").offsetWidth,height:root.querySelector(".window").offsetHeight};
};
document.addEventListener("click",function(e){const b=e.target.closest("button[data-screen]");if(b){if(b.closest('#review-controls'))window.meetingContext='product';if(b.dataset.meeting)window.meetingContext=b.dataset.meeting;renderScreen(b.dataset.screen)}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&document.body.dataset.screen==="prejoin"){renderScreen(meetingContexts[window.meetingContext].conversation);return}if(e.key==="Escape"&&["search","settings","incoming","create34","create35","sharepicker"].includes(document.body.dataset.screen))renderScreen(document.body.dataset.screen==="sharepicker"?"call":"chat");if((e.metaKey||e.ctrlKey)&&e.key==="k"){e.preventDefault();renderScreen("search")}});
screenDefinitions.forEach(function(s){const b=document.createElement("button");b.textContent=s.title;b.dataset.screen=s.id;document.getElementById("review-controls").append(b)});
const params=new URLSearchParams(location.search);
if(meetingContexts[params.get('conversation')])window.meetingContext=params.get('conversation');
if(params.has("review"))document.body.classList.add("review-mode");
renderScreen(params.get("screen")||"server");
})();
</script>
</body>
</html>
